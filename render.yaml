# Creates a paid service. Review the cost and environment values before deploying.
services:
  - type: web
    name: vox-louveira
    runtime: node
    repo: https://github.com/jeremiasthomaz8-commits/vox
    branch: main
    plan: 0.5c-512mb
    region: virginia
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: vox-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VOX_DB
        value: /var/data/vox.sqlite
      - key: TRUST_PROXY
        value: "true"
      # PUBLIC_ORIGIN defaults to Render's generated HTTPS URL.
      - key: VOX_ADMIN_USERNAME
        value: admregulacaodiretor
      - key: VOX_UNIT_USERNAME
        value: UBSMonterrey
      - key: VOX_ADMIN_PASSWORD
        sync: false
      - key: VOX_UNIT_PASSWORD
        sync: false
      # Set to true only after the existing municipal review is approved.
      - key: LEGAL_REVIEW_APPROVED
        sync: false
      - key: PHOTO_CAPTURE_ENABLED
        value: "true"
      - key: PHOTO_PRIVACY_APPROVED
        sync: false
      - key: PHOTO_ENCRYPTION_KEY
        generateValue: true
